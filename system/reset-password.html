<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova password | Cori San Vito</title>
    <link rel="icon" href="/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#301934">
    <meta name="theme-color" content="#301934">

    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/portale.css">
    <link rel="stylesheet" href="/style/login.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="/">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="/">Tutti i cori</a></li>
                <li><a href="/canti">Canti</a></li>
                <li><a href="/portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-wrap">
        <div class="login-card" id="card-reset">
            <h2>Nuova password</h2>
            <p class="sottotitolo">Scegli una nuova password per il tuo account</p>

            <div class="campo">
                <label for="password">Nuova password</label>
                <input type="password" id="password" placeholder="Almeno 8 caratteri" autocomplete="new-password">
            </div>

            <div class="campo">
                <label for="conferma">Conferma password</label>
                <input type="password" id="conferma" placeholder="Ripeti la password" autocomplete="new-password">
            </div>

            <button class="btn-login" id="btn-salva">Salva password</button>
            <p class="errore" id="messaggio"></p>
        </div>

        <!-- Mostrata se il token è assente o scaduto -->
        <div class="login-card" id="card-errore" style="display:none;">
            <h2>Link non valido</h2>
            <p class="sottotitolo">Questo link è scaduto o non è valido. Richiedi un nuovo link di reset.</p>
            <a href="/portale/forgot-password" class="btn-login"
                style="display:block; text-align:center; text-decoration:none; margin-top:1rem;">
                Richiedi nuovo link
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Cori San Vito - <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');

        // Se non c'è token nell'URL, mostra subito la card di errore
        if (!token) {
            document.getElementById('card-reset').style.display = 'none';
            document.getElementById('card-errore').style.display = 'block';
        }

        const btn = document.getElementById('btn-salva');
        const messaggio = document.getElementById('messaggio');

        btn.addEventListener('click', async () => {
            const password = document.getElementById('password').value;
            const conferma = document.getElementById('conferma').value;

            if (!password || !conferma) {
                mostra('Compila tutti i campi.', false);
                return;
            }
            if (password.length < 8) {
                mostra('La password deve avere almeno 8 caratteri.', false);
                return;
            }
            if (password !== conferma) {
                mostra('Le password non coincidono.', false);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Salvataggio…';
            messaggio.classList.remove('visibile');

            try {
                const res = await fetch('https://corisanvito-backend.onrender.com/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password }),
                });

                const data = await res.json();

                if (res.ok) {
                    mostra(data.message, true);
                    btn.style.display = 'none';
                    setTimeout(() => window.location.href = '/login', 2500);
                } else {
                    // Token scaduto o non valido → mostra card errore
                    if (res.status === 400) {
                        document.getElementById('card-reset').style.display = 'none';
                        document.getElementById('card-errore').style.display = 'block';
                    } else {
                        mostra(data.message || 'Errore. Riprova.', false);
                    }
                }
            } catch (e) {
                mostra('Errore di connessione. Riprova.', false);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Salva password';
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') btn.click();
        });

        function mostra(msg, ok) {
            messaggio.textContent = msg;
            messaggio.style.color = ok ? '#2e7d32' : '#c0392b';
            messaggio.classList.add('visibile');
        }
    </script>
</body>

</html>

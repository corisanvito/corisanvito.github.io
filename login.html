<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi | Cori San Vito</title>
    <link rel="icon" href="../images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#301934">
    <meta name="theme-color" content="#301934">

    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/portale.css">
    <link rel="stylesheet" href="/style/login.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="./">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="./">Tutti i cori</a></li>
                <li><a href="./canti">Canti</a></li>
                <li><a href="./portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-wrap">
        <div class="login-card">
            <h2>Area riservata</h2>
            <p class="sottotitolo">Accedi con le credenziali ricevute</p>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nome@esempio.it" autocomplete="email">
            </div>

            <div class="campo">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button class="btn-login" id="btn-login">Accedi</button>
            <p class="errore" id="errore"></p>
        </div>
    </div>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script type="module">
        import { login, saveAuth, getToken, getUtente } from '/script/api.js';

        // Se già loggato, vai subito al portale
        if (getToken() && getUtente()) {
            window.location.href = '/portale/';
        }

        const btnLogin = document.getElementById('btn-login');
        const errore = document.getElementById('errore');

        btnLogin.addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                mostraErrore('Compila tutti i campi.');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.textContent = 'Accesso in corso…';
            errore.classList.remove('visibile');

            try {
                const data = await login(email, password);

                if (data.token) {
                    saveAuth(data.token, data.utente);
                    window.location.href = '/portale/';
                } else {
                    mostraErrore(data.message || 'Credenziali non valide.');
                }
            } catch (e) {
                mostraErrore('Errore di connessione. Riprova.');
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Accedi';
            }
        });

        // Login anche premendo Invio
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') btnLogin.click();
        });

        function mostraErrore(msg) {
            errore.textContent = msg;
            errore.classList.add('visibile');
        }
    </script>
</body>

</html>

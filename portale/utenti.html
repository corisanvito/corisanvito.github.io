<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione utenti | Cori San Vito</title>

    <link rel="icon" href="../images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#555555">
    <meta name="theme-color" content="#555555">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/portale.css">
    <link rel="stylesheet" href="/style/utenti.css">
    <link rel="stylesheet" href="/style/tab-cori.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="../">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="..">Home</a></li>
                <li><a href="../canti">Canti</a></li>
                <li><a href="../calendario">Calendario</a></li>
                <li><a href="../portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Gestione utenti</h2>

        <div class="form-nuovo">
            <h3>Nuovo account</h3>
            <div class="form-row">
                <div class="campo"><label>Nome *</label><input type="text" id="u-nome"></div>
                <div class="campo"><label>Cognome *</label><input type="text" id="u-cognome"></div>
                <div class="campo"><label>Email *</label><input type="email" id="u-email"></div>
                <div class="campo"><label>Password temporanea *</label><input type="text" id="u-password"></div>
                <div class="campo">
                    <label>Ruolo</label>
                    <select id="u-ruolo">
                        <option value="corista">Corista</option>
                        <option value="strumentista">Strumentista</option>
                        <option value="responsabile">Responsabile</option>
                        <option value="direttore">Direttore</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Cori</label>
                    <div id="u-cori" class="cori-selector">
                        <!-- popolato da JS -->
                    </div>
                </div>
                <div class="campo">
                    <label>Tipo di voce / Strumento</label>
                    <select id="u-vocetipo">
                        <option value="">—</option>
                        <option value="bianca">Bianca</option>
                        <option value="soprano">Soprano</option>
                        <option value="contralto">Contralto</option>
                        <option value="tenore">Tenore</option>
                        <option value="basso">Basso</option>
                        <option value="chitarra">Chitarra</option>
                        <option value="pianoforte">Pianoforte</option>
                    </select>
                </div>
                <div class="campo"><label>Data di nascita</label><input type="date" id="u-nascita"></div>
                <div class="campo"><label>Telefono</label><input type="tel" id="u-telefono"></div>
                <div class="campo"><label>Note</label><input type="text" id="u-note" placeholder="Note aggiuntive…">
                </div>
            </div>
            <button class="btn-primary" id="btn-crea"><i class="fa-solid fa-user-plus"></i> Crea account</button>
            <p class="messaggio" id="msg-crea"></p>
        </div>

        <div class="tabs-cori" id="tabs-cori"></div>
        <div id="pannello-utenti">
            <p>Caricamento…</p>
        </div>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script type="module">
        import { requireAuth } from '/script/auth-guard.js';
        import { apiCall, getCori } from '/script/api.js';

        const utente = requireAuth(['admin', 'direttore', 'responsabile']);
        if (!utente) throw new Error();

        const cori = await getCori();

        // Popola selettore cori
        const selCori = document.getElementById('u-cori');
        (cori || []).forEach(c => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'coro-option';
            button.dataset.id = c._id;
            button.innerHTML = `<i class="fa-regular fa-circle"style="color: #301934;"></i> ${c.nome}`;
            button.addEventListener('click', () => toggleOption(button));
            selCori.appendChild(button);
        });

        // Logica toggle per bottoni selezionabili (cori)
        function toggleOption(btn) {
            btn.classList.toggle('selezionato');
            const icon = btn.querySelector('i');
            icon.className = btn.classList.contains('selezionato')
                ? 'fa-solid fa-circle-check'
                : 'fa-regular fa-circle';
        }

        // Carica e mostra gli utenti del coro attivo (o tutti se coroId === 'tutti')
        async function caricaUtentiCoro(coroId) {
            const pannello = document.getElementById('pannello-utenti');
            pannello.innerHTML = '<p>Caricamento…</p>';

            const tutti = coroId === 'tutti';
            const utenti = await apiCall('/users');
            const filtrati = (utenti || []).filter(u => {
                if (u.ruolo === 'admin') return false;
                if (tutti) return true;
                return u.cori?.some(c => (c._id || c).toString() === coroId);
            });

            if (filtrati.length === 0) {
                pannello.innerHTML = `<p style="color:#888;font-style:italic">Nessun utente${tutti ? '' : ' in questo coro'}.</p>`;
                return;
            }

            const colonnaCoro = tutti ? '<th>Cori</th>' : '';

            pannello.innerHTML = `
                <div class="tabella-wrap">
                    <table>
                        <thead><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Voce / Strumento</th>${colonnaCoro}<th>Stato</th><th>Azioni</th></tr></thead>
                        <tbody>
                            ${filtrati.map(u => `
                                <tr>
                                    <td>${u.nome} ${u.cognome}</td>
                                    <td>${u.email}</td>
                                    <td>${u.ruolo}</td>
                                    <td>${u.tipoVoce || '—'}</td>
                                    ${tutti ? `<td>${(u.cori || []).map(c => c.nome).join(', ') || '—'}</td>` : ''}
                                    <td><span class="badge ${u.attivo ? 'attivo' : 'inattivo'}">${u.attivo ? 'Attivo' : 'In attesa'}</span></td>
                                    <td>
                                        ${!u.attivo ? `<button class="btn-sm ok" onclick="attivaUtente('${u._id}', '${coroId}')">Attiva</button>` : ''}
                                        <button class="btn-sm danger" onclick="eliminaUtente('${u._id}', '${coroId}')"><i class="fa-solid fa-trash"style="color: #301934;"></i> Elimina</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Genera tab cori
        const coriMe = await getCori();
        const tabsCori = document.getElementById('tabs-cori');
        tabsCori.innerHTML = `<button class="tab-coro attivo" data-id="tutti">Tutti</button>` +
            coriMe.map(c => `<button class="tab-coro" data-id="${c._id}">${c.nome}</button>`).join('');

        document.querySelectorAll('.tab-coro').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-coro').forEach(b => b.classList.remove('attivo'));
                btn.classList.add('attivo');
                caricaUtentiCoro(btn.dataset.id);
            });
        });

        // Carica "Tutti" di default
        caricaUtentiCoro('tutti');

        // Crea nuovo account
        document.getElementById('btn-crea').addEventListener('click', async () => {
            const coriSelezionati = [...selCori.querySelectorAll('.coro-option.selezionato')].map(o => o.dataset.id);
            const body = {
                nome: document.getElementById('u-nome').value.trim(),
                cognome: document.getElementById('u-cognome').value.trim(),
                email: document.getElementById('u-email').value.trim(),
                password: document.getElementById('u-password').value,
                ruolo: document.getElementById('u-ruolo').value,
                cori: coriSelezionati,
                tipoVoce: document.getElementById('u-vocetipo').value,
                dataNascita: document.getElementById('u-nascita').value || null,
                telefono: document.getElementById('u-telefono').value.trim(),
                note: document.getElementById('u-note').value.trim()
            };
            if (!body.nome || !body.cognome || !body.email || !body.password) {
                alert('Compila tutti i campi obbligatori (*)'); return;
            }
            const res = await apiCall('/users', { method: 'POST', body: JSON.stringify(body) });
            const msg = document.getElementById('msg-crea');
            msg.textContent = res?.message || 'Account creato!';
            msg.className = res?.message?.includes('attesa') ? 'messaggio ok' : 'messaggio err';
            if (res?.message?.includes('attesa')) {
                ['u-nome', 'u-cognome', 'u-email', 'u-password', 'u-telefono', 'u-note'].forEach(id => document.getElementById(id).value = '');
                document.getElementById('u-nascita').value = '';
                document.getElementById('u-vocetipo').value = '';
                selCori.querySelectorAll('.coro-option').forEach(o => {
                    o.classList.remove('selezionato');
                    o.querySelector('i').className = 'fa-regular fa-circle';
                });
                const tabAttivo = document.querySelector('.tab-coro.attivo');
                if (tabAttivo) caricaUtentiCoro(tabAttivo.dataset.id);
            }
        });

        window.attivaUtente = async (id, coroId) => {
            await apiCall(`/users/${id}/attiva`, { method: 'PATCH' });
            caricaUtentiCoro(coroId);
        };

        window.eliminaUtente = async (id, coroId) => {
            if (!confirm('Eliminare questo utente?')) return;
            await apiCall(`/users/${id}`, { method: 'DELETE' });
            caricaUtentiCoro(coroId);
        };
    </script>
</body>

</html>

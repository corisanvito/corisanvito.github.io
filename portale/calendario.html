<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario | Cori San Vito</title>

    <link rel="icon" href="../images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#555555">
    <meta name="theme-color" content="#555555">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/portale.css">
    <link rel="stylesheet" href="/style/tab-cori.css">
    <link rel="stylesheet" href="/style/calendario.css">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="../">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="..">Tutti i cori</a></li>
                <li><a href="../canti">Canti</a></li>
                <li><a href="../portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Calendario</h2>
        <div class="tabs-cori" id="tabs-cori"></div>
        <div id="contenuto-calendario">
            <p class="vuoto">Seleziona un coro per vedere il calendario.</p>
        </div>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script type="module">
        import { requireAuth } from '/script/auth-guard.js';
        import { apiCall, getCori } from '/script/api.js';

        const utente = requireAuth();
        if (!utente) throw new Error();

        const isAdmin = ['admin', 'direttore', 'responsabile'].includes(utente.ruolo);
        const me = await apiCall('/auth/me');

        // Admin vede tutti i cori, coristi solo i loro
        const cori = isAdmin ? await getCori() : (me.cori || []);

        const tabsCori = document.getElementById('tabs-cori');
        tabsCori.innerHTML = cori.map((c, i) => `
            <button class="tab-coro ${i === 0 ? 'attivo' : ''}" data-id="${c._id}" data-nome="${c.nome}">
                ${c.nome}
            </button>
        `).join('');

        let calendarioCorrente = null;

        async function caricaCalendario(coroId, coroNome) {
            const contenuto = document.getElementById('contenuto-calendario');
            contenuto.innerHTML = '<p class="vuoto">Caricamento…</p>';

            const eventi = await apiCall(`/calendario/${coroId}`);

            if (!eventi || eventi.error) {
                contenuto.innerHTML = '<p class="vuoto">Errore nel caricamento del calendario.</p>';
                return;
            }

            contenuto.innerHTML = `<div id="calendar-${coroId}"></div>`;

            if (calendarioCorrente) {
                calendarioCorrente.destroy();
            }

            const calendarEl = document.getElementById(`calendar-${coroId}`);
            calendarioCorrente = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'it',
                height: 'auto',
                headerToolbar: {
                    left:   'prev,next today',
                    center: 'title',
                    right:  'dayGridMonth,listMonth'
                },
                buttonText: {
                    today:     'Oggi',
                    month:     'Mese',
                    list:      'Lista'
                },
                events: eventi,
                eventColor: '#301934',
                eventClick: function(info) {
                    const e = info.event;
                    const start = e.start?.toLocaleDateString('it-IT', {
                        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                    });
                    const desc = e.extendedProps.description
                        ? `\n\n${e.extendedProps.description}` : '';
                    const loc = e.extendedProps.location
                        ? `\n📍 ${e.extendedProps.location}` : '';
                    alert(`📅 ${e.title}\n${start}${loc}${desc}`);
                },
                noEventsText: 'Nessun evento in programma.'
            });

            calendarioCorrente.render();
        }

        document.querySelectorAll('.tab-coro').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-coro').forEach(b => b.classList.remove('attivo'));
                btn.classList.add('attivo');
                caricaCalendario(btn.dataset.id, btn.dataset.nome);
            });
        });

        // Carica il primo coro di default
        if (cori.length > 0) caricaCalendario(cori[0]._id, cori[0].nome);
    </script>
</body>

</html>

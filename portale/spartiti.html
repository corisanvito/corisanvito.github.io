<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spartiti | Cori San Vito</title>

    <link rel="icon" href="../images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#301934">
    <meta name="theme-color" content="#301934">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/portale.css">
    <link rel="stylesheet" href="/style/spartiti.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="../">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="..">Tutti i cori</a></li>
                <li><a href="../canti">Canti</a></li>
                <li><a href="../portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Spartiti e accordi</h2>

        <!-- FORM UPLOAD -->
        <div class="form-upload card-box">
            <h3>Carica un file</h3>
            <div class="form-row">
                <div class="campo">
                    <label>Canto *</label>
                    <select id="sel-canto">
                        <option value="">Seleziona un canto…</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Tonalità</label>
                    <input type="text" id="inp-tonalita" placeholder="es. Do maggiore, La minore…">
                </div>
            </div>
            <div class="campo">
                <label>Strumenti</label>
                <div id="check-strumenti" class="cori-selector"></div>
            </div>
            <div class="campo">
                <label>File *</label>
                <input type="file" id="inp-file" accept=".pdf,.jpg,.jpeg,.png,.mp3,.wav,.ogg"
                    style="width:100%;padding:0.5rem;border:1px solid #ddd;border-radius:5px;font-family:inherit;font-size:0.9rem">
                <small style="color:#888;font-size:0.78rem">PDF, immagini, audio</small>
            </div>
            <button class="btn-primary" id="btn-carica">
                <i class="fa-solid fa-upload"></i> Carica
            </button>
            <p class="messaggio" id="msg-upload"></p>
        </div>

        <!-- RICERCA -->
        <div class="campo" style="margin-bottom:1.5rem">
            <input type="text" id="inp-cerca" placeholder="🔍 Cerca per titolo canto…">
        </div>

        <!-- LISTA SPARTITI -->
        <div id="lista-spartiti">
            <p class="vuoto">Caricamento…</p>
        </div>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script type="module">
        import { requireAuth } from '/script/auth-guard.js';
        import { apiCall } from '/script/api.js';

        const utente = requireAuth(['admin', 'direttore', 'responsabile', 'strumentista']);
        if (!utente) throw new Error();

        const isAdmin = ['admin', 'direttore', 'responsabile'].includes(utente.ruolo);

        const STRUMENTI = [
            'chitarra', 'pianoforte', 'organo', 'basso', 'batteria',
            'violino', 'flauto', 'tromba', 'coro', 'voce'
        ];

        // Popola strumenti
        const checkStrumenti = document.getElementById('check-strumenti');
        STRUMENTI.forEach(s => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'coro-option';
            btn.dataset.value = s;
            btn.innerHTML = `<i class="fa-regular fa-circle" style="color:#301934"></i> ${s}`;
            btn.addEventListener('click', () => {
                btn.classList.toggle('selezionato');
                const icon = btn.querySelector('i');
                icon.className = btn.classList.contains('selezionato')
                    ? 'fa-solid fa-circle-check'
                    : 'fa-regular fa-circle';
            });
            checkStrumenti.appendChild(btn);
        });

        // Carica canti per la tendina
        const canti = await apiCall('/canti');
        const selCanto = document.getElementById('sel-canto');
        (canti || []).sort((a, b) => a.titolo.localeCompare(b.titolo)).forEach(c => {
            const o = document.createElement('option');
            o.value = c._id;
            o.textContent = c.titolo;
            selCanto.appendChild(o);
        });

        // Carica spartiti
        let tuttiSpartiti = [];

        async function caricaSpartiti() {
            const lista = document.getElementById('lista-spartiti');
            tuttiSpartiti = await apiCall('/spartiti') || [];
            renderSpartiti(tuttiSpartiti);
        }

        function renderSpartiti(spartiti) {
            const lista = document.getElementById('lista-spartiti');

            if (spartiti.length === 0) {
                lista.innerHTML = '<p class="vuoto">Nessun file caricato.</p>';
                return;
            }

            // Raggruppa per canto
            const map = {};
            spartiti.forEach(s => {
                const titolo = s.canto?.titolo || 'Sconosciuto';
                if (!map[titolo]) map[titolo] = [];
                map[titolo].push(s);
            });

            lista.innerHTML = Object.entries(map)
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([titolo, files]) => `
                    <div class="spartito-gruppo card-box">
                        <h3 class="spartito-titolo-canto">🎵 ${titolo}</h3>
                        ${files.map(s => `
                            <div class="spartito-row">
                                <div class="spartito-info">
                                    <a href="${s.file.url}" target="_blank" class="allegato-link">
                                        <i class="fa-solid fa-file"></i> ${s.file.nome}
                                    </a>
                                    <div class="spartito-meta">
                                        ${s.tonalita ? `<span class="tag-meta">🎼 ${s.tonalita}</span>` : ''}
                                        ${(s.strumenti || []).map(st => `<span class="tag-meta">🎸 ${st}</span>`).join('')}
                                        <span class="tag-meta">👤 ${s.caricatoDa ? s.caricatoDa.nome + ' ' + s.caricatoDa.cognome : '—'}</span>
                                        <span class="tag-meta">📅 ${new Date(s.createdAt).toLocaleDateString('it-IT')}</span>
                                    </div>
                                </div>
                                ${isAdmin || s.caricatoDa?._id === utente.id
                                    ? `<button class="btn-sm danger" onclick="eliminaSpartito('${s._id}')">
                                        <i class="fa-solid fa-trash"></i>
                                       </button>`
                                    : ''}
                            </div>
                        `).join('')}
                    </div>
                `).join('');
        }

        // Ricerca
        document.getElementById('inp-cerca').addEventListener('input', function () {
            const q = this.value.toLowerCase().trim();
            const filtrati = q
                ? tuttiSpartiti.filter(s => s.canto?.titolo?.toLowerCase().includes(q))
                : tuttiSpartiti;
            renderSpartiti(filtrati);
        });

        // Upload
        document.getElementById('btn-carica').addEventListener('click', async () => {
            const cantoId   = selCanto.value;
            const tonalita  = document.getElementById('inp-tonalita').value.trim();
            const strumenti = [...checkStrumenti.querySelectorAll('.coro-option.selezionato')].map(b => b.dataset.value);
            const file      = document.getElementById('inp-file').files[0];
            const msg       = document.getElementById('msg-upload');

            if (!cantoId) { alert('Seleziona un canto.'); return; }
            if (!file)    { alert('Seleziona un file.'); return; }

            msg.textContent = 'Caricamento in corso…';
            msg.className   = 'messaggio';

            const fd = new FormData();
            fd.append('canto',     cantoId);
            fd.append('tonalita',  tonalita);
            fd.append('strumenti', JSON.stringify(strumenti));
            fd.append('file',      file);

            try {
                const token = localStorage.getItem('csv_token');
                const res   = await fetch('https://corisanvito-backend.onrender.com/spartiti', {
                    method:  'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body:    fd
                });
                const data = await res.json();

                if (data._id) {
                    msg.className   = 'messaggio ok';
                    msg.textContent = '✓ File caricato!';
                    selCanto.value  = '';
                    document.getElementById('inp-tonalita').value = '';
                    document.getElementById('inp-file').value     = '';
                    checkStrumenti.querySelectorAll('.coro-option').forEach(b => {
                        b.classList.remove('selezionato');
                        b.querySelector('i').className = 'fa-regular fa-circle';
                    });
                    caricaSpartiti();
                } else {
                    msg.className   = 'messaggio err';
                    msg.textContent = data.message || 'Errore nel caricamento.';
                }
            } catch (err) {
                msg.className   = 'messaggio err';
                msg.textContent = 'Errore di connessione.';
            }
        });

        window.eliminaSpartito = async (id) => {
            if (!confirm('Eliminare questo file?')) return;
            await apiCall(`/spartiti/${id}`, { method: 'DELETE' });
            caricaSpartiti();
        };

        caricaSpartiti();
    </script>
</body>

</html>

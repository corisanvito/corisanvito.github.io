<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2e2a35">
    <title>Portale | Cori San Vito</title>
    <link rel="stylesheet" href="/style/style.css">
    <style>
        .benvenuto {
            margin-bottom: 2rem;
        }

        .benvenuto h2 {
            margin-bottom: 0.2rem;
        }

        .benvenuto p {
            color: #888;
            font-size: 0.95rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: var(--c-grey);
            transition: box-shadow 0.2s, transform 0.2s;
            display: block;
        }

        .card:hover {
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
            text-decoration: none;
            color: var(--c-grey);
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 0.8rem;
        }

        .card h3 {
            margin-bottom: 0.3rem;
            font-size: 1.1rem;
        }

        .card p {
            font-size: 0.88rem;
            color: #888;
            margin: 0;
        }

        .btn-logout {
            background: none;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 0.4rem 1rem;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--c-grey);
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background: #f0f0f0;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
    </style>
</head>

<body>
    <header>
        <h1><a href="/">Cori San Vito</a></h1>
        <nav>
            <ul>
                <li><a href="/portale/bacheca.html">Bacheca</a></li>
                <li><a href="/portale/presenze.html">Presenze</a></li>
                <li><a href="/portale/profilo.html">Profilo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="benvenuto">
            <div class="header-row">
                <h2 id="titolo-benvenuto">Ciao!</h2>
                <button class="btn-logout" id="btn-logout">Esci</button>
            </div>
            <p id="sottotitolo-ruolo"></p>
        </div>

        <div class="card-grid" id="card-grid"></div>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy.html">Privacy</a></p>
    </footer>

    <script type="module">
        import { requireAuth, logout } from '/script/auth-guard.js';
        import { apiCall } from '/script/api.js';

        const utente = requireAuth();
        if (!utente) throw new Error('Non autenticato');

        // Carica dati freschi dal server (per avere cori popolati)
        const me = await apiCall('/auth/me');

        document.getElementById('titolo-benvenuto').textContent = `Ciao, ${me.nome}!`;
        document.getElementById('btn-logout').addEventListener('click', logout);

        const ruoliLabel = {
            direttore: 'Direttore',
            responsabile: 'Responsabile',
            corista: 'Corista',
            strumentista: 'Strumentista'
        };

        const coriNomi = me.cori?.length ? me.cori.map(c => c.nome).join(', ') : '';
        document.getElementById('sottotitolo-ruolo').textContent =
            `${ruoliLabel[me.ruolo] || me.ruolo}${coriNomi ? ' · ' + coriNomi : ''}`;

        const cardsBase = [
            { href: '/portale/bacheca.html', icon: '📋', titolo: 'Bacheca', desc: 'Avvisi e comunicazioni del coro' },
            { href: '/portale/presenze.html', icon: '📊', titolo: 'Presenze', desc: 'Le tue statistiche di presenza' },
            { href: '/portale/profilo.html', icon: '👤', titolo: 'Il mio profilo', desc: 'Modifica i tuoi dati personali' },
        ];

        const cardsAdmin = [
            { href: '/portale/utenti.html', icon: '👥', titolo: 'Gestione utenti', desc: 'Crea e attiva gli account' },
            { href: '/portale/canti-admin.html', icon: '🎵', titolo: 'Gestione canti', desc: 'Aggiungi, modifica, elimina canti' },
            { href: '/portale/registro.html', icon: '✅', titolo: 'Registro presenze', desc: 'Segna le presenze alle prove' },
        ];

        const isAdmin = ['direttore', 'responsabile'].includes(me.ruolo);
        const cards = isAdmin ? [...cardsBase, ...cardsAdmin] : cardsBase;

        document.getElementById('card-grid').innerHTML = cards.map(c => `
            <a class="card" href="${c.href}">
                <div class="card-icon">${c.icon}</div>
                <h3>${c.titolo}</h3>
                <p>${c.desc}</p>
            </a>
        `).join('');
    </script>
</body>

</html>

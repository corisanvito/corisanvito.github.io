<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correggi un canto | Cori San Vito</title>

    <link rel="icon" href="../images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#301934">
    <meta name="theme-color" content="#301934">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/portale.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="../">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="..">Tutti i cori</a></li>
                <li><a href="../canti">Canti</a></li>
                <li><a href="../portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Correggi un canto</h2>
        <p class="info" style="margin-bottom:1.5rem">
            Hai notato un errore nel testo di un canto o vuoi suggerire una modifica?
            Compila il modulo e la segnalazione verrà inviata al responsabile del sito.
        </p>

        <div class="card-box">
            <form id="correggiForm" action="https://formsubmit.co/corisanvito@gmail.com" method="POST">

                <div class="campo">
                    <label for="nome_canto">Nome del canto *</label>
                    <select id="nome_canto" name="nome_canto" required>
                        <option value="">Caricamento canti…</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="tipo_segnalazione">Tipo di segnalazione *</label>
                    <select id="tipo_segnalazione" name="tipo_segnalazione" required>
                        <option value="">Seleziona…</option>
                        <option value="Errore nel testo">Errore nel testo</option>
                        <option value="Testo incompleto">Testo incompleto</option>
                        <option value="Errore nella formattazione">Errore nella formattazione</option>
                        <option value="Link YouTube errato">Link YouTube errato</option>
                        <option value="Altro">Altro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="descrizione">Descrizione della segnalazione *</label>
                    <textarea id="descrizione" name="descrizione" required rows="6"
                        placeholder="Descrivi l'errore o la modifica che vorresti suggerire. Se possibile, indica la parte esatta del testo da correggere e la versione corretta."></textarea>
                </div>

                <div class="campo">
                    <label for="testo_corretto">Testo corretto (opzionale)</label>
                    <textarea id="testo_corretto" name="testo_corretto" rows="6"
                        placeholder="Se conosci la versione corretta, incollala qui…"></textarea>
                </div>

                <button type="submit" class="btn-primary">Invia segnalazione</button>

                <!-- Campi nascosti FormSubmit -->
                <input type="hidden" name="_subject" id="subject" value="">
                <input type="hidden" name="_next" value="https://corisanvito.github.io/system/grazie-segnalazione">
                <input type="hidden" name="_captcha" value="true">
            </form>
        </div>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script type="module">
        import { requireAuth } from '/script/auth-guard.js';
        import { apiCall } from '/script/api.js';
    
        const utente = requireAuth();
        if (!utente) throw new Error();
    
        // Imposta il subject
        document.getElementById('subject').value =
            `✏️ Segnalazione canto da ${utente.nome} ${utente.cognome}`;
    
        // Carica canti dal backend
        const canti = await apiCall('/canti');
        const sel = document.getElementById('nome_canto');
        sel.innerHTML = '<option value="">Seleziona un canto…</option>';
        (canti || [])
            .sort((a, b) => a.titolo.localeCompare(b.titolo))
            .forEach(c => {
                const o = document.createElement('option');
                o.value = c.titolo;
                o.textContent = c.titolo;
                sel.appendChild(o);
            });
    </script>
</body>

</html>

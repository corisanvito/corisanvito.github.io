<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacheca | Cori San Vito</title>

    <link rel="icon" href="../images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#301934">
    <meta name="theme-color" content="#301934">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/portale.css">
    <link rel="stylesheet" href="/style/bacheca.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="../">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="..">Tutti i cori</a></li>
                <li><a href="../canti">Canti</a></li>
                <li><a href="../portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Bacheca</h2>
        <div id="form-nuovo" style="display:none">
            <div class="form-nuovo">
                <h3>Nuovo avviso</h3>
                <div class="campo">
                    <label>Titolo</label>
                    <input type="text" id="titolo-avviso" placeholder="Titolo dell'avviso">
                </div>
                <div class="campo">
                    <label>Testo</label>
                    <textarea id="testo-avviso" placeholder="Scrivi il messaggio…"></textarea>
                </div>
                <div class="campo">
                    <label>Destinatari</label>
                    <select id="tipo-destinatari">
                        <option value="coro">Tutti i coristi di un coro</option>
                        <option value="voce">Per voce / strumento</option>
                        <option value="utenti">Utenti specifici</option>
                    </select>
                </div>

                <div class="campo" id="campo-coro">
                    <label>Cori</label>
                    <div id="toggle-cori" class="cori-selector"></div>
                </div>

                <div class="campo" id="campo-voci" style="display:none">
                    <label>Cori</label>
                    <div id="toggle-cori-voci" class="cori-selector"></div>
                    <label style="margin-top:0.8rem;display:block">Voci / Strumenti</label>
                    <div id="check-voci" class="cori-selector"></div>
                </div>

                <div class="campo" id="campo-utenti" style="display:none">
                    <label>Utenti</label>
                    <div id="check-utenti" class="cori-selector"></div>
                </div>

                <div class="campo">
                    <label>Allegati (max 5 file)</label>
                    <button type="button" class="btn-sm" id="btn-aggiungi-file" style="margin-bottom:0.5rem">
                        <i class="fa-solid fa-paperclip"></i> Aggiungi file
                    </button>
                    <input type="file" id="allegati-avviso" multiple accept="*/*" style="display:none">
                    <ul id="lista-file" style="list-style:none;padding:0;margin:0"></ul>
                    <small style="color:#888;font-size:0.78rem">PDF, audio, video, immagini… (max 5 file totali)</small>
                </div>

                <button class="btn-primary" id="btn-pubblica">Pubblica</button>
                <p class="messaggio" id="msg-bacheca"></p>
            </div>
        </div>
        <div id="lista-avvisi">
            <p class="vuoto">Caricamento…</p>
        </div>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script type="module">
        import { requireAuth } from '/script/auth-guard.js';
        import { apiCall, getCori } from '/script/api.js';

        const utente = requireAuth();
        if (!utente) throw new Error();

        const isAdmin = ['admin', 'direttore', 'responsabile'].includes(utente.ruolo);
        const lista = document.getElementById('lista-avvisi');

        const VOCI = ['bianca', 'soprano', 'contralto', 'tenore', 'basso', 'chitarra', 'pianoforte'];

        // --- Gestione file accumulati ---
        let fileAccumulati = [];

        document.getElementById('btn-aggiungi-file').addEventListener('click', () => {
            document.getElementById('allegati-avviso').click();
        });

        document.getElementById('allegati-avviso').addEventListener('change', (e) => {
            const nuovi = Array.from(e.target.files);
            for (const f of nuovi) {
                if (fileAccumulati.length >= 5) { alert('Puoi allegare al massimo 5 file.'); break; }
                if (!fileAccumulati.find(x => x.name === f.name && x.size === f.size)) {
                    fileAccumulati.push(f);
                }
            }
            e.target.value = ''; // reset input così si può riselezionare lo stesso file
            aggiornaListaFile();
        });

        function aggiornaListaFile() {
            const ul = document.getElementById('lista-file');
            ul.innerHTML = fileAccumulati.map((f, i) => `
                <li style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.9rem">
                    <i class="fa-solid fa-paperclip" style="color:#888"></i>
                    <span style="flex:1">${f.name}</span>
                    <button type="button" class="btn-sm danger" onclick="rimuoviFile(${i})">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </li>
            `).join('');
        }

        window.rimuoviFile = (i) => {
            fileAccumulati.splice(i, 1);
            aggiornaListaFile();
        };

        // --- Toggle ---
        function toggleOption(btn) {
            btn.classList.toggle('selezionato');
            const icon = btn.querySelector('i');
            icon.className = btn.classList.contains('selezionato')
                ? 'fa-solid fa-circle-check'
                : 'fa-regular fa-circle';
        }

        function creaToggleCoro(c) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'coro-option';
            btn.dataset.id = c._id;
            btn.innerHTML = `<i class="fa-regular fa-circle" style="color:#301934"></i> ${c.nome}`;
            btn.addEventListener('click', () => toggleOption(btn));
            return btn;
        }

        function resetToggle(container) {
            container.querySelectorAll('.coro-option').forEach(b => {
                b.classList.remove('selezionato');
                b.querySelector('i').className = 'fa-regular fa-circle';
            });
        }

        // --- Deduplicazione avvisi ---
        function deduplicaAvvisi(avvisi) {
            const mappa = new Map();
            for (const a of avvisi) {
                const chiave = `${a.titolo}||${a.testo}||${(a.destinatariVoci || []).join(',')}||${(a.destinatariUtenti || []).map(u => u._id || u).join(',')}`;
                if (mappa.has(chiave)) {
                    const esistente = mappa.get(chiave);
                    if (a.coro && !esistente.cori.find(c => c._id === a.coro._id)) {
                        esistente.cori.push(a.coro);
                    }
                } else {
                    mappa.set(chiave, { ...a, cori: a.coro ? [a.coro] : [] });
                }
            }
            return [...mappa.values()];
        }

        async function caricaAvvisi() {
            const avvisiRaw = await apiCall('/bacheca');
            if (!avvisiRaw || avvisiRaw.length === 0) {
                lista.innerHTML = '<p class="vuoto">Nessun avviso al momento.</p>';
                return;
            }

            const avvisi = deduplicaAvvisi(avvisiRaw);

            lista.innerHTML = avvisi.map(a => {
                let dest = '';
                const nomiCori = (a.cori || []).map(c => c.nome).join(', ');
                if (a.destinatariVoci?.length) {
                    dest = `<span class="tag-coro">${nomiCori ? nomiCori + ' · ' : ''}🎵 ${a.destinatariVoci.join(', ')}</span>`;
                } else if (a.destinatariUtenti?.length) {
                    dest = `<span class="tag-coro">👤 ${a.destinatariUtenti.map(u => u.nome).join(', ')}</span>`;
                } else if (nomiCori) {
                    dest = `<span class="tag-coro">${nomiCori}</span>`;
                } else {
                    dest = '<span class="tag-coro">Tutti</span>';
                }

                const allegati = (a.allegati || []).map(al => `
                    <a href="${al.downloadLink}" target="_blank" class="allegato-link">
                        <i class="fa-solid fa-paperclip"></i> ${al.nome}
                    </a>
                `).join('');

                return `
                    <div class="avviso-card" data-id="${a._id}">
                        <h3>${a.titolo} ${dest}</h3>
                        <p class="avviso-meta">${a.autore ? a.autore.nome + ' ' + a.autore.cognome : ''} · ${new Date(a.createdAt).toLocaleDateString('it-IT')}</p>
                        <p class="avviso-testo">${a.testo}</p>
                        ${allegati ? `<div class="allegati-wrap">${allegati}</div>` : ''}
                        ${isAdmin ? `<div class="azioni-avviso">
                            <button class="btn-sm danger" onclick="eliminaAvviso('${a._id}')"><i class="fa-solid fa-trash"></i> Elimina</button>
                        </div>` : ''}
                    </div>
                `;
            }).join('');
        }

        async function pubblicaAvviso(token, titolo, testo, coroId, voci, utentiIds, files) {
            const fd = new FormData();
            fd.append('titolo', titolo);
            fd.append('testo', testo);
            if (coroId) fd.append('coro', coroId);
            if (voci) fd.append('destinatariVoci', JSON.stringify(voci));
            if (utentiIds) fd.append('destinatariUtenti', JSON.stringify(utentiIds));
            for (const file of files) fd.append('allegati', file);
            const res = await fetch('https://corisanvito-backend.onrender.com/bacheca', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: fd
            });
            return res.json();
        }

        if (isAdmin) {
            document.getElementById('form-nuovo').style.display = 'block';

            const me = await apiCall('/auth/me');
            const cori = utente.ruolo === 'admin' ? await getCori() : (me.cori || []);
            const tuttiUtenti = await apiCall('/users');

            const toggleCori = document.getElementById('toggle-cori');
            cori.forEach(c => toggleCori.appendChild(creaToggleCoro(c)));

            const toggleCoriVoci = document.getElementById('toggle-cori-voci');
            cori.forEach(c => toggleCoriVoci.appendChild(creaToggleCoro(c)));

            const checkVoci = document.getElementById('check-voci');
            VOCI.forEach(v => {
                const label = document.createElement('label');
                label.className = 'checkbox-label';
                label.innerHTML = `<input type="checkbox" value="${v}"> ${v}`;
                checkVoci.appendChild(label);
            });

            const checkUtenti = document.getElementById('check-utenti');
            (tuttiUtenti || []).filter(u => u.ruolo !== 'admin').forEach(u => {
                const label = document.createElement('label');
                label.className = 'checkbox-label';
                label.innerHTML = `<input type="checkbox" value="${u._id}"> ${u.nome} ${u.cognome}`;
                checkUtenti.appendChild(label);
            });

            document.getElementById('tipo-destinatari').addEventListener('change', function () {
                document.getElementById('campo-coro').style.display = this.value === 'coro' ? 'block' : 'none';
                document.getElementById('campo-voci').style.display = this.value === 'voce' ? 'block' : 'none';
                document.getElementById('campo-utenti').style.display = this.value === 'utenti' ? 'block' : 'none';
            });

            document.getElementById('btn-pubblica').addEventListener('click', async () => {
                const titolo = document.getElementById('titolo-avviso').value.trim();
                const testo = document.getElementById('testo-avviso').value.trim();
                const tipo = document.getElementById('tipo-destinatari').value;
                const msg = document.getElementById('msg-bacheca');
                const token = localStorage.getItem('csv_token');

                if (!titolo || !testo) { alert('Compila titolo e testo.'); return; }

                msg.textContent = 'Caricamento in corso…';
                msg.className = 'messaggio';

                try {
                    if (tipo === 'coro') {
                        const coriSelezionati = [...toggleCori.querySelectorAll('.coro-option.selezionato')].map(b => b.dataset.id);
                        if (coriSelezionati.length === 0) {
                            await pubblicaAvviso(token, titolo, testo, null, null, null, fileAccumulati);
                        } else {
                            for (const coroId of coriSelezionati) {
                                await pubblicaAvviso(token, titolo, testo, coroId, null, null, fileAccumulati);
                            }
                        }
                    } else if (tipo === 'voce') {
                        const voci = [...document.querySelectorAll('#check-voci input:checked')].map(i => i.value);
                        if (voci.length === 0) { alert('Seleziona almeno una voce.'); return; }
                        const coriVociSelezionati = [...toggleCoriVoci.querySelectorAll('.coro-option.selezionato')].map(b => b.dataset.id);
                        if (coriVociSelezionati.length === 0) {
                            await pubblicaAvviso(token, titolo, testo, null, voci, null, fileAccumulati);
                        } else {
                            for (const coroId of coriVociSelezionati) {
                                await pubblicaAvviso(token, titolo, testo, coroId, voci, null, fileAccumulati);
                            }
                        }
                    } else if (tipo === 'utenti') {
                        const utentiIds = [...document.querySelectorAll('#check-utenti input:checked')].map(i => i.value);
                        await pubblicaAvviso(token, titolo, testo, null, null, utentiIds, fileAccumulati);
                    }

                    msg.className = 'messaggio ok';
                    msg.textContent = '✓ Avviso pubblicato!';
                    document.getElementById('titolo-avviso').value = '';
                    document.getElementById('testo-avviso').value = '';
                    fileAccumulati = [];
                    aggiornaListaFile();
                    document.querySelectorAll('#check-voci input, #check-utenti input').forEach(i => i.checked = false);
                    resetToggle(toggleCori);
                    resetToggle(toggleCoriVoci);
                    caricaAvvisi();
                } catch (err) {
                    msg.className = 'messaggio err';
                    msg.textContent = 'Errore di connessione.';
                }
            });
        }

        window.eliminaAvviso = async (id) => {
            if (!confirm('Eliminare questo avviso?')) return;
            await apiCall(`/bacheca/${id}`, { method: 'DELETE' });
            caricaAvvisi();
        };

        caricaAvvisi();
    </script>
</body>

</html>

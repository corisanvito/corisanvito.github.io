<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenze | Cori San Vito</title>

  <link rel="icon" href="../images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <link rel="manifest" href="../images/site.webmanifest">

  <meta name="msapplication-TileColor" content="#555555">
  <meta name="theme-color" content="#555555">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/portale.css">
  <link rel="stylesheet" href="/style/presenze.css">
  <link rel="stylesheet" href="/style/tab-cori.css">

  <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
    data-utcoffset="2"></script>
</head>

<body>
  <header>
    <h1><a href="../">Cori San Vito</a></h1>
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="menu-icon">
      <span></span>
      <span></span>
      <span></span>
    </label>
    <div class="overlay"></div>
    <nav>
      <ul>
        <li><a href="..">Home</a></li>
        <li><a href="../canti">Canti</a></li>
        <li><a href="../calendario">Calendario</a></li>
        <li><a href="../portale">Area riservata</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2 id="titolo-presenze">Presenze</h2>
    <div id="contenuto">
      <p>Caricamento…</p>
    </div>
  </main>

  <footer>
    <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
  </footer>

  <script type="module">
    import { requireAuth } from '/script/auth-guard.js';
    import { apiCall, getCori } from '/script/api.js';

    const utente = requireAuth(['admin', 'direttore', 'responsabile']);
    if (!utente) throw new Error();

    const isAdmin = ['admin', 'direttore', 'responsabile'].includes(utente.ruolo);
    const contenuto = document.getElementById('contenuto');

    document.getElementById('titolo-presenze').textContent = isAdmin
      ? 'Presenze coristi'
      : 'Le mie presenze';

    if (!isAdmin) {
      // Vista corista: statistiche personali
      const [stat, presenze] = await Promise.all([
        apiCall('/presenze/statistiche'),
        apiCall('/presenze')
      ]);

      if (!stat) {
        contenuto.innerHTML = '<p>Errore nel caricamento.</p>';
      } else {
        const righe = (presenze || []).map(p => `
          <tr>
            <td>${new Date(p.data).toLocaleDateString('it-IT')}</td>
            <td>${p.tipo === 'prova' ? 'Prova' : 'Celebrazione'}</td>
            <td><span class="badge ${p.presente ? 'presente' : 'assente'}">${p.presente ? 'Presente' : 'Assente'}</span></td>
            <td>${p.note || '—'}</td>
          </tr>
        `).join('');

        contenuto.innerHTML = `
          <div class="stat-grid">
            <div class="stat-card"><div class="stat-numero">${stat.percentuale}%</div><div class="stat-label">Presenze totali</div></div>
            <div class="stat-card"><div class="stat-numero">${stat.presenti}</div><div class="stat-label">Volte presente</div></div>
            <div class="stat-card"><div class="stat-numero">${stat.assenti}</div><div class="stat-label">Volte assente</div></div>
            <div class="stat-card"><div class="stat-numero">${stat.prove}</div><div class="stat-label">Prove</div></div>
            <div class="stat-card"><div class="stat-numero">${stat.celebrazioni}</div><div class="stat-label">Celebrazioni</div></div>
          </div>
          <p class="sezione-titolo">Percentuale presenze</p>
          <div class="barra-wrap"><div class="barra" style="width:${stat.percentuale}%"></div></div>
          ${righe ? `<div class="tabella-wrap"><table>
            <thead><tr><th>Data</th><th>Tipo</th><th>Presenza</th><th>Note</th></tr></thead>
            <tbody>${righe}</tbody>
          </table></div>` : '<p style="color:#888;font-style:italic">Nessuna presenza registrata.</p>'}
        `;
      }

    } else {
      // Vista admin: schede per coro
      const cori = await getCori();

      if (!cori || cori.length === 0) {
        contenuto.innerHTML = '<p style="color:#888">Nessun coro trovato.</p>';
      } else {
        contenuto.innerHTML = `
          <div class="tabs-cori">
            ${cori.map((c, i) => `
              <button class="tab-coro ${i === 0 ? 'attivo' : ''}" data-id="${c._id}" data-nome="${c.nome}">
                ${c.nome}
              </button>
            `).join('')}
          </div>
          <div id="pannello-coro"><p>Caricamento…</p></div>
        `;

        async function caricaCoro(coroId, coroNome) {
          const pannello = document.getElementById('pannello-coro');
          pannello.innerHTML = '<p>Caricamento…</p>';

          const presenze = await apiCall(`/presenze/coro/${coroId}`);

          if (!presenze || presenze.length === 0) {
            pannello.innerHTML = '<p style="color:#888;font-style:italic">Nessuna presenza registrata per questo coro.</p>';
            return;
          }

          // Raggruppa per corista
          const map = {};
          presenze.forEach(p => {
            if (!p.utente) return; // salta presenze con utente eliminato
            const uid = p.utente._id;
            if (!map[uid]) map[uid] = { nome: p.utente.nome + ' ' + p.utente.cognome, presenti: 0, totale: 0, righe: [] };
            map[uid].totale++;
            if (p.presente) map[uid].presenti++;
            map[uid].righe.push(p);
          });

          // Ordina per percentuale decrescente
          const coristi = Object.entries(map)
            .map(([uid, d]) => ({
              ...d,
              percentuale: Math.round(d.presenti / d.totale * 100)
            }))
            .sort((a, b) => b.percentuale - a.percentuale);

          const mediaPercentuale = Math.round(
            coristi.reduce((acc, d) => acc + d.percentuale, 0) / coristi.length
          );

          pannello.innerHTML = `
  <!-- STATISTICHE RIEPILOGO -->
  <div class="stat-riepilogo">
    <div class="stat-card">
      <div class="stat-numero">${coristi.length}</div>
      <div class="stat-label">Coristi</div>
    </div>
    <div class="stat-card">
      <div class="stat-numero">${mediaPercentuale}%</div>
      <div class="stat-label">Presenza media</div>
    </div>
    <div class="stat-card">
      <div class="stat-numero">${presenze.filter(p => p.tipo === 'prova').length}</div>
      <div class="stat-label">Prove registrate</div>
    </div>
    <div class="stat-card">
      <div class="stat-numero">${presenze.filter(p => p.tipo === 'celebrazione').length}</div>
      <div class="stat-label">Celebrazioni registrate</div>
    </div>
  </div>

  <!-- CLASSIFICA -->
  <div class="classifica-wrap">
    <h4 style="margin-bottom:0.8rem"><i class="fa-solid fa-trophy"style="color: #301934;"></i> Classifica presenze</h4>
    <div class="tabella-wrap">
      <table>
        <thead><tr><th>#</th><th>Corista</th><th>Presenze</th><th>Percentuale</th><th></th></tr></thead>
        <tbody>
          ${coristi.map((d, i) => `
            <tr>
              <td style="font-weight:700;color:${i === 0 ? '#f4b942' : i === 1 ? '#aaa' : i === 2 ? '#cd7f32' : 'inherit'}">
                ${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}
              </td>
              <td>${d.nome}</td>
              <td>${d.presenti}/${d.totale}</td>
              <td>
                <div style="display:flex;align-items:center;gap:0.5rem">
                  <div style="flex:1;background:#eee;border-radius:10px;height:8px;min-width:60px">
                    <div style="width:${d.percentuale}%;background:${d.percentuale >= 75 ? '#2e7d32' : d.percentuale >= 50 ? '#f4b942' : '#c0392b'};height:8px;border-radius:10px"></div>
                  </div>
                  <span style="font-weight:600;min-width:2.5rem">${d.percentuale}%</span>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <!-- DETTAGLIO PER CORISTA -->
  <h4 style="margin:1.5rem 0 0.8rem">Dettaglio presenze</h4>
  ${coristi.map(d => `
    <div class="corista-sezione">
      <div class="corista-header">
        <span class="corista-nome-admin">${d.nome}</span>
        <span class="corista-perc">${d.percentuale}% (${d.presenti}/${d.totale})</span>
      </div>
      <div class="tabella-wrap">
        <table>
          <thead><tr><th>Data</th><th>Tipo</th><th>Presenza</th><th>Note</th><th></th></tr></thead>
          <tbody>
            ${d.righe.map(p => `
              <tr>
                <td>${new Date(p.data).toLocaleDateString('it-IT')}</td>
                <td>${p.tipo === 'prova' ? 'Prova' : 'Celebrazione'}</td>
                <td><span class="badge ${p.presente ? 'presente' : 'assente'}">${p.presente ? 'Presente' : 'Assente'}</span></td>
                <td>${p.note || '—'}</td>
                <td><button class="btn-sm danger" onclick="eliminaPresenza('${p._id}', '${coroId}', '${coroNome}')">Elimina</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `).join('')}
`;
        }

        // Click sui tab
        document.querySelectorAll('.tab-coro').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-coro').forEach(b => b.classList.remove('attivo'));
            btn.classList.add('attivo');
            caricaCoro(btn.dataset.id, btn.dataset.nome);
          });
        });

        window.eliminaPresenza = async (id, coroId, coroNome) => {
          if (!confirm('Eliminare questa presenza?')) return;
          await apiCall(`/presenze/${id}`, { method: 'DELETE' });
          caricaCoro(coroId, coroNome);
        };

        // Carica il primo coro di default
        caricaCoro(cori[0]._id, cori[0].nome);
      }
    }
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione libretti | Cori San Vito</title>

    <link rel="icon" href="../images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#301934">
    <meta name="theme-color" content="#301934">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/portale.css">
    <link rel="stylesheet" href="/style/tab-cori.css">
    <link rel="stylesheet" href="/style/libretti.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="../">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="..">Tutti i cori</a></li>
                <li><a href="../canti">Canti</a></li>
                <li><a href="../portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Gestione libretti</h2>

        <div class="tabs-cori" id="tabs-cori"></div>

        <div id="pannello-libretti">
            <p class="vuoto">Seleziona un coro per vedere i libretti.</p>
        </div>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script type="module">
        import { requireAuth } from '/script/auth-guard.js';
        import { apiCall, getCori } from '/script/api.js';

        const utente = requireAuth(['admin']);
        if (!utente) throw new Error();

        const cori = await getCori();

        // Genera tab cori
        const tabsCori = document.getElementById('tabs-cori');
        tabsCori.innerHTML = cori.map((c, i) => `
            <button class="tab-coro ${i === 0 ? 'attivo' : ''}" data-id="${c._id}" data-nome="${c.nome}">
                ${c.nome}
            </button>
        `).join('');

        let coroAttivoId = cori[0]?._id;
        let tuttiCanti = [];
        let filtroCorrente = '';
        let ordinamentoCorrente = 'titolo'; // 'titolo' | 'numero'

        async function caricaLibretti(coroId) {
            const pannello = document.getElementById('pannello-libretti');
            pannello.innerHTML = '<p class="vuoto">Caricamento…</p>';

            tuttiCanti = await apiCall(`/stock/${coroId}`) || [];
            renderLibretti(tuttiCanti);
        }

        function renderLibretti(canti) {
            const pannello = document.getElementById('pannello-libretti');

            const totaleCopie = canti.reduce((acc, c) => acc + c.stock, 0);
            const cantiConCopie = canti.filter(c => c.stock > 0).length;

            pannello.innerHTML = `
                <!-- Statistiche -->
                <div class="libretti-stats">
                    <div class="stat-card">
                        <div class="stat-numero">${totaleCopie}</div>
                        <div class="stat-label">Copie totali</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-numero">${cantiConCopie}</div>
                        <div class="stat-label">Canti con copie</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-numero">${canti.length}</div>
                        <div class="stat-label">Canti totali</div>
                    </div>
                </div>

                <!-- Filtri -->
                <div class="libretti-filtri">
                    <input type="text" id="cerca-canto" placeholder="🔍 Cerca canto…"
                        value="${filtroCorrente}"
                        style="flex:1;padding:0.6rem 0.9rem;border:1px solid #ddd;border-radius:5px;font-family:inherit;font-size:0.95rem">
                    <select id="filtro-stock" style="padding:0.6rem 0.9rem;border:1px solid #ddd;border-radius:5px;font-family:inherit;font-size:0.95rem">
                        <option value="tutti">Tutti</option>
                        <option value="disponibili">Solo con copie</option>
                        <option value="esauriti">Solo esauriti</option>
                    </select>
                </div>

                <!-- Tabella -->
                <div class="tabella-wrap" style="margin-top:1rem">
                    <table id="tabella-libretti">
                        <thead>
                            <tr>
                                <th class="th-ordinabile" id="th-numero" style="width:70px;text-align:center">N° ${ordinamentoCorrente === 'numero' ? '▾' : ''}</th>
                                <th class="th-ordinabile" id="th-titolo">Canto ${ordinamentoCorrente === 'titolo' ? '▾' : ''}</th>
                                <th style="width:120px;text-align:center">Copie</th>
                                <th style="width:180px;text-align:center">Azioni</th>
                                <th style="width:80px;text-align:center">Note</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-libretti">
                            ${renderRighe(ordina(canti))}
                        </tbody>
                    </table>
                </div>
            `;

            // Event listeners
            document.getElementById('cerca-canto').addEventListener('input', function () {
                filtroCorrente = this.value;
                applicaFiltri();
            });

            document.getElementById('filtro-stock').addEventListener('change', applicaFiltri);

            document.getElementById('th-numero').addEventListener('click', () => {
                ordinamentoCorrente = 'numero';
                document.getElementById('th-numero').innerHTML = 'N° ▾';
                document.getElementById('th-titolo').textContent = 'Canto';
                applicaFiltri();
            });
            document.getElementById('th-titolo').addEventListener('click', () => {
                ordinamentoCorrente = 'titolo';
                document.getElementById('th-titolo').textContent = 'Canto ▾';
                document.getElementById('th-numero').textContent = 'N°';
                applicaFiltri();
            });
        }

        function ordina(lista) {
            const copia = [...lista];
            if (ordinamentoCorrente === 'numero') {
                copia.sort((a, b) => {
                    const na = parseFloat(a.numeroLibretto);
                    const nb = parseFloat(b.numeroLibretto);
                    const aVuoto = a.numeroLibretto === '' || isNaN(na);
                    const bVuoto = b.numeroLibretto === '' || isNaN(nb);
                    if (aVuoto && bVuoto) return a.titolo.localeCompare(b.titolo);
                    if (aVuoto) return 1;
                    if (bVuoto) return -1;
                    return na - nb;
                });
            } else {
                copia.sort((a, b) => a.titolo.localeCompare(b.titolo));
            }
            return copia;
        }

        function renderRighe(canti) {
            if (canti.length === 0) {
                return '<tr><td colspan="5" style="text-align:center;color:#888;font-style:italic">Nessun canto trovato.</td></tr>';
            }

            return canti.map(c => `
                <tr class="${c.stock === 0 ? 'riga-esaurita' : c.stock <= 2 ? 'riga-scarsa' : 'riga-ok'}">
                    <td style="text-align:center">
                        <input type="text" class="input-numero" value="${c.numeroLibretto || ''}" placeholder="—"
                            onchange="aggiornaNumero('${c._id}', this.value, '${coroAttivoId}')">
                    </td>
                    <td>
                        <div class="canto-nome">${c.titolo}</div>
                        ${c.autore ? `<div class="canto-meta">${c.autore}</div>` : ''}
                    </td>
                    <td style="text-align:center">
                        <span class="badge-stock ${c.stock === 0 ? 'zero' : c.stock <= 2 ? 'scarso' : 'ok'}">
                            ${c.stock}
                        </span>
                    </td>
                    <td style="text-align:center">
                        <div class="azioni-stock">
                            <button class="btn-stock minus" onclick="aggiornaStock('${c._id}', ${c.stock - 1}, '${coroAttivoId}')"
                                ${c.stock === 0 ? 'disabled' : ''}>
                                <i class="fa-solid fa-minus"></i>
                            </button>
                            <input type="number" class="input-stock" value="${c.stock}" min="0"
                                onchange="aggiornaStockDiretto('${c._id}', this.value, '${coroAttivoId}')">
                            <button class="btn-stock plus" onclick="aggiornaStock('${c._id}', ${c.stock + 1}, '${coroAttivoId}')">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </td>
                    <td style="text-align:center">
                        <button class="btn-sm" onclick="apriNote('${c._id}', '${coroAttivoId}', \`${(c.note || '').replace(/`/g, "'")}\`)"
                            title="${c.note || 'Aggiungi nota'}">
                            <i class="fa-${c.note ? 'solid' : 'regular'} fa-note-sticky"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function applicaFiltri() {
            const cerca = document.getElementById('cerca-canto')?.value.toLowerCase() || '';
            const filtroStock = document.getElementById('filtro-stock')?.value || 'tutti';

            let filtrati = tuttiCanti.filter(c => {
                const matchCerca = c.titolo.toLowerCase().includes(cerca);
                const matchStock = filtroStock === 'tutti' ? true
                    : filtroStock === 'disponibili' ? c.stock > 0
                        : c.stock === 0;
                return matchCerca && matchStock;
            });

            document.getElementById('tbody-libretti').innerHTML = renderRighe(ordina(filtrati));
        }

        window.aggiornaStock = async (cantoId, nuovoStock, coroId) => {
            if (nuovoStock < 0) return;
            await apiCall(`/stock/${coroId}/${cantoId}`, {
                method: 'PATCH',
                body: JSON.stringify({ stock: nuovoStock })
            });
            await caricaLibretti(coroId);
        };

        window.aggiornaStockDiretto = async (cantoId, valore, coroId) => {
            const nuovoStock = parseInt(valore);
            if (isNaN(nuovoStock) || nuovoStock < 0) return;
            await apiCall(`/stock/${coroId}/${cantoId}`, {
                method: 'PATCH',
                body: JSON.stringify({ stock: nuovoStock })
            });
            await caricaLibretti(coroId);
        };

        window.aggiornaNumero = async (cantoId, valore, coroId) => {
            await apiCall(`/stock/${coroId}/${cantoId}`, {
                method: 'PATCH',
                body: JSON.stringify({ numeroLibretto: valore.trim() })
            });
            const canto = tuttiCanti.find(c => c._id === cantoId);
            if (canto) canto.numeroLibretto = valore.trim();
        };

        window.apriNote = async (cantoId, coroId, noteAttuali) => {
            const nuovaNota = prompt('Note per questo canto:', noteAttuali);
            if (nuovaNota === null) return; // annullato
            await apiCall(`/stock/${coroId}/${cantoId}`, {
                method: 'PATCH',
                body: JSON.stringify({ note: nuovaNota })
            });
            await caricaLibretti(coroId);
        };

        // Tab click
        document.querySelectorAll('.tab-coro').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-coro').forEach(b => b.classList.remove('attivo'));
                btn.classList.add('attivo');
                coroAttivoId = btn.dataset.id;
                filtroCorrente = '';
                caricaLibretti(coroAttivoId);
            });
        });

        // Carica primo coro di default
        if (cori.length > 0) caricaLibretti(cori[0]._id);
    </script>
</body>

</html>

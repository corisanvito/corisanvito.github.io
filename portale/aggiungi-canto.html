<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi un canto | Cori San Vito</title>

    <link rel="icon" href="../images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#555555">
    <meta name="theme-color" content="#555555">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/form.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32" data-utcoffset="2"></script>
</head>
<body>
    <header>
        <h1><a href="../">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="..">Home</a></li>
                <li><a href="../canti">Canti</a></li>
                <li><a href="../calendario">Calendario</a></li>
                <li><a href="../portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Aggiungi un canto</h2>

        <form id="cantoForm" action="https://formsubmit.co/corisanvito@gmail.com" method="POST">

            <label class="label-input" for="nome_canto">Nome del canto *</label>
            <input type="text" id="nome_canto" name="nome_canto" required>

            <label class="label-input" for="autore">Autore</label>
            <input type="text" id="autore" name="autore">

            <label class="label-input" for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" placeholder="es. avvento, offertorio…">

            <label class="label-input" for="testo_canto">Testo del canto *</label>
            <p class="info">Scopri come scrivere il testo correttamente: <a href="../system/docs/guida-scrittura-canti">Guida alla formattazione</a>.</p>
            <textarea id="testo_canto" name="testo_canto" rows="15" required></textarea>

            <label class="label-input" for="video_youtube">Link YouTube (facoltativo)</label>
            <input type="url" id="video_youtube" name="video_youtube" placeholder="https://youtube.com/...">

            <label class="label-input" for="numero_libretto">Numero sul libretto (facoltativo)</label>
            <input type="text" id="numero_libretto" name="numero_libretto" placeholder="Lascia vuoto se non presente nel libretto 'Cantiamo al Signore'">

            <label class="label-input" for="note">Note</label>
            <input type="text" id="note" name="note">

            <button type="submit" class="btn-primary">Invia</button>

            <!-- Campi nascosti per FormSubmit -->
            <input type="hidden" name="_subject" id="subject" value="">
            <input type="hidden" name="_next" value="https://corisanvito.github.io/system/grazie">
            <input type="hidden" name="_captcha" value="true">
            <input type="hidden" name="_replyto" id="replyto" value="">
            <input type="hidden" name="_append" value="---
Inserire questo canto come pagina HTML, aggiornare la lista su excel, la pagina canti e il file canti.json">
        </form>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script>
        document.getElementById('cantoForm').addEventListener('submit', function () {
            const nomeCanto = document.getElementById('nome_canto').value.trim();
            document.getElementById('subject').value = 'Nuovo canto da inserire: ' + nomeCanto;
        });
    </script>
</body>
</html>

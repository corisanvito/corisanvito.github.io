<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password dimenticata | Cori San Vito</title>
    <link rel="icon" href="/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#301934">
    <meta name="theme-color" content="#301934">

    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/portale.css">
    <link rel="stylesheet" href="/style/login.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="/">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="/">Tutti i cori</a></li>
                <li><a href="/canti">Canti</a></li>
                <li><a href="/portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-wrap">
        <div class="login-card">
            <h2>Password dimenticata</h2>
            <p class="sottotitolo">Inserisci la tua email e ti invieremo un link per reimpostare la password</p>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nome@esempio.it" autocomplete="email">
            </div>

            <button class="btn-login" id="btn-invia">Invia link</button>
            <p class="errore" id="messaggio"></p>

            <p class="return-to-login">
                <a href="/login">← Torna al login</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Cori San Vito - <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script>
        const btn = document.getElementById('btn-invia');
        const messaggio = document.getElementById('messaggio');

        btn.addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();

            if (!email) {
                mostra('Inserisci la tua email.', false);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Invio in corso…';
            messaggio.classList.remove('visibile');

            try {
                const res = await fetch('https://corisanvito-backend.onrender.com/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await res.json();
                mostra(data.message, true);
            } catch (e) {
                mostra('Errore di connessione. Riprova.', false);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Invia link';
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') btn.click();
        });

        function mostra(msg, ok) {
            messaggio.textContent = msg;
            messaggio.style.color = ok ? '#2e7d32' : '#c0392b';
            messaggio.classList.add('visibile');
        }
    </script>
</body>

</html>

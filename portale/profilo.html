<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio profilo | Cori San Vito</title>

    <link rel="icon" href="../images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../images/site.webmanifest">

    <meta name="msapplication-TileColor" content="#555555">
    <meta name="theme-color" content="#555555">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/profilo.css">

    <script src="https://cdn.counter.dev/script.js" data-id="0b8a28a7-bd9e-4970-aa87-bd107e273a32"
        data-utcoffset="2"></script>
</head>

<body>
    <header>
        <h1><a href="../">Cori San Vito</a></h1>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="overlay"></div>
        <nav>
            <ul>
                <li><a href="..">Home</a></li>
                <li><a href="../canti">Canti</a></li>
                <li><a href="../calendario">Calendario</a></li>
                <li><a href="../portale">Area riservata</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Il mio profilo</h2>
        <div class="profilo-card">
            <div class="profilo-header">
                <div class="avatar" id="avatar">…</div>
                <div>
                    <div class="profilo-nome" id="profilo-nome">Caricamento…</div>
                    <div class="profilo-ruolo" id="profilo-ruolo"></div>
                </div>
            </div>

            <p class="sezione-titolo">Dati non modificabili</p>
            <div class="campo">
                <label>Nome e cognome</label>
                <div class="campo-readonly" id="ro-nome"></div>
            </div>
            <div class="campo">
                <label>Ruolo</label>
                <div class="campo-readonly" id="ro-ruolo"></div>
            </div>
            <div class="campo">
                <label>Cori</label>
                <div class="campo-readonly" id="ro-cori"></div>
            </div>

            <p class="sezione-titolo">Dati personali</p>
            <div class="campo">
                <label>Email</label>
                <input type="email" id="p-email">
            </div>
            <div class="campo">
                <label>Tipo di voce / Strumento</label>
                <div id="p-vocetipo" class="cori-selector">
                    <button type="button" class="coro-option" data-value="bianca"><i class="fa-regular fa-circle"></i>
                        Bianca</button>
                    <button type="button" class="coro-option" data-value="soprano"><i class="fa-regular fa-circle"></i>
                        Soprano</button>
                    <button type="button" class="coro-option" data-value="contralto"><i
                            class="fa-regular fa-circle"></i> Contralto</button>
                    <button type="button" class="coro-option" data-value="tenore"><i class="fa-regular fa-circle"></i>
                        Tenore</button>
                    <button type="button" class="coro-option" data-value="basso"><i class="fa-regular fa-circle"></i>
                        Basso</button>
                    <button type="button" class="coro-option" data-value="chitarra"><i class="fa-regular fa-circle"></i>
                        Chitarra</button>
                    <button type="button" class="coro-option" data-value="pianoforte"><i
                            class="fa-regular fa-circle"></i> Pianoforte</button>
                </div>
            </div>
            <div class="campo">
                <label>Data di nascita</label>
                <input type="date" id="p-nascita">
            </div>
            <div class="campo">
                <label>Telefono</label>
                <input type="tel" id="p-telefono" placeholder="+39 …">
            </div>
            <div class="campo">
                <label>Note personali</label>
                <textarea id="p-note" placeholder="Eventuali note…" style="min-height:80px"></textarea>
            </div>

            <button class="btn-primary" id="btn-salva">Salva modifiche</button>
            <p class="messaggio" id="msg"></p>

            <p class="sezione-titolo">Cambio password</p>
            <div class="campo">
                <label>Password attuale</label>
                <input type="password" id="p-pwd-attuale" placeholder="••••••••">
            </div>
            <div class="campo">
                <label>Nuova password</label>
                <input type="password" id="p-pwd-nuova" placeholder="••••••••">
            </div>
            <div class="campo">
                <label>Conferma nuova password</label>
                <input type="password" id="p-pwd-conferma" placeholder="••••••••">
            </div>
            <button class="btn-primary" id="btn-password">Cambia password</button>
            <p class="messaggio" id="msg-pwd"></p>
        </div>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy">Privacy</a></p>
    </footer>

    <script type="module">
        import { requireAuth } from '/script/auth-guard.js';
        import { apiCall } from '/script/api.js';

        const utente = requireAuth();
        if (!utente) throw new Error();

        // Logica toggle per bottoni voce/strumento
        function toggleOption(btn) {
            btn.classList.toggle('selezionato');
            const icon = btn.querySelector('i');
            icon.className = btn.classList.contains('selezionato')
                ? 'fa-solid fa-circle-check'
                : 'fa-regular fa-circle';
        }

        document.querySelectorAll('#p-vocetipo .coro-option').forEach(btn => {
            btn.addEventListener('click', () => toggleOption(btn));
        });

        // Imposta i bottoni voce in base ai valori salvati (stringa separata da virgola)
        function impostaVoci(tipoVoce) {
            const valori = (tipoVoce || '').split(',').map(v => v.trim()).filter(Boolean);
            document.querySelectorAll('#p-vocetipo .coro-option').forEach(btn => {
                const selezionato = valori.includes(btn.dataset.value);
                btn.classList.toggle('selezionato', selezionato);
                btn.querySelector('i').className = selezionato
                    ? 'fa-solid fa-circle-check'
                    : 'fa-regular fa-circle';
            });
        }

        async function carica() {
            const me = await apiCall('/auth/me');
            if (!me) {
                document.querySelector('.profilo-card').innerHTML = '<p>Errore nel caricamento.</p>';
                return;
            }

            document.getElementById('avatar').textContent = (me.nome[0] + me.cognome[0]).toUpperCase();
            document.getElementById('profilo-nome').textContent = `${me.nome} ${me.cognome}`;
            document.getElementById('profilo-ruolo').textContent = me.ruolo;

            document.getElementById('ro-nome').textContent = `${me.nome} ${me.cognome}`;
            document.getElementById('ro-ruolo').textContent = me.ruolo;
            const coriTesto = me.cori?.length
                ? me.cori.map(c => typeof c === 'object' ? c.nome : c).join(', ')
                : '—';
            document.getElementById('ro-cori').textContent = coriTesto;

            document.getElementById('p-email').value = me.email || '';
            document.getElementById('p-telefono').value = me.telefono || '';
            document.getElementById('p-note').value = me.note || '';
            if (me.dataNascita) {
                document.getElementById('p-nascita').value = new Date(me.dataNascita).toISOString().split('T')[0];
            }

            // Imposta bottoni voce/strumento
            impostaVoci(me.tipoVoce);

            document.getElementById('btn-salva').onclick = async () => {
                const vociSelezionate = [...document.querySelectorAll('#p-vocetipo .coro-option.selezionato')]
                    .map(o => o.dataset.value)
                    .join(', ');
                const body = {
                    email: document.getElementById('p-email').value.trim(),
                    tipoVoce: vociSelezionate,
                    dataNascita: document.getElementById('p-nascita').value || null,
                    telefono: document.getElementById('p-telefono').value.trim(),
                    note: document.getElementById('p-note').value.trim()
                };
                const res = await apiCall(`/users/${me._id}/profilo`, { method: 'PATCH', body: JSON.stringify(body) });
                const msg = document.getElementById('msg');
                if (res?._id) {
                    msg.className = 'messaggio ok';
                    msg.textContent = '✓ Profilo aggiornato!';
                } else {
                    msg.className = 'messaggio err';
                    msg.textContent = res?.message || 'Errore nel salvataggio.';
                }
            };

            document.getElementById('btn-password').onclick = async () => {
                const attuale = document.getElementById('p-pwd-attuale').value;
                const nuova = document.getElementById('p-pwd-nuova').value;
                const conferma = document.getElementById('p-pwd-conferma').value;
                const msg = document.getElementById('msg-pwd');

                if (!attuale || !nuova || !conferma) {
                    msg.className = 'messaggio err'; msg.textContent = 'Compila tutti i campi.'; return;
                }
                if (nuova !== conferma) {
                    msg.className = 'messaggio err'; msg.textContent = 'Le password non coincidono.'; return;
                }
                if (nuova.length < 6) {
                    msg.className = 'messaggio err'; msg.textContent = 'Minimo 6 caratteri.'; return;
                }

                const res = await apiCall(`/users/${me._id}/password`, {
                    method: 'PATCH',
                    body: JSON.stringify({ passwordAttuale: attuale, passwordNuova: nuova })
                });

                if (res?.message === 'ok') {
                    msg.className = 'messaggio ok';
                    msg.textContent = '✓ Password aggiornata!';
                    document.getElementById('p-pwd-attuale').value = '';
                    document.getElementById('p-pwd-nuova').value = '';
                    document.getElementById('p-pwd-conferma').value = '';
                } else {
                    msg.className = 'messaggio err';
                    msg.textContent = res?.message || 'Errore nel cambio password.';
                }
            };
        }

        carica();
    </script>
</body>

</html>

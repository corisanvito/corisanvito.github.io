<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2e2a35">
    <title>Gestione canti | Cori San Vito</title>
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/canti-admin.css">
</head>

<body>
    <header>
        <h1><a href="/">Cori San Vito</a></h1>
        <nav>
            <ul>
                <li><a href="/portale/index.html">Dashboard</a></li>
                <li><a href="/portale/canti-admin.html" class="active">Canti</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Gestione canti</h2>

        <div class="form-canto">
            <h3>Aggiungi canto</h3>
            <div class="form-row">
                <div class="campo"><label>Titolo *</label><input type="text" id="c-titolo"></div>
                <div class="campo"><label>Autore</label><input type="text" id="c-autore"></div>
                <div class="campo"><label>Categoria</label><input type="text" id="c-categoria"
                        placeholder="es. avvento, natale…"></div>
            </div>
            <div class="campo"><label>Testo</label><textarea id="c-testo" placeholder="Testo del canto…"></textarea>
            </div>
            <div class="campo"><label>Note</label><textarea id="c-note" placeholder="Note aggiuntive…"
                    style="min-height:60px"></textarea></div>
            <button class="btn-primary" id="btn-aggiungi">Aggiungi canto</button>
            <p class="messaggio" id="msg-canto"></p>
        </div>

        <div id="lista-canti">
            <p class="vuoto">Caricamento…</p>
        </div>
    </main>

    <footer>
        <p>© Cori San Vito — <a class="privacy" href="/privacy.html">Privacy</a></p>
    </footer>

    <script type="module">
        import { requireAuth } from '/script/auth-guard.js';
        import { apiCall } from '/script/api.js';

        const utente = requireAuth(['direttore', 'responsabile']);
        if (!utente) throw new Error();

        async function caricaCanti() {
            const canti = await apiCall('/canti');
            const lista = document.getElementById('lista-canti');
            if (!canti || canti.length === 0) {
                lista.innerHTML = '<p class="vuoto">Nessun canto inserito.</p>';
                return;
            }
            lista.innerHTML = canti.map(c => `
                <div class="canto-card">
                    <div class="canto-info">
                        <h3>${c.titolo}</h3>
                        <p>${c.autore || ''}${c.categoria ? ' · ' + c.categoria : ''}</p>
                    </div>
                    <div class="canto-azioni">
                        <label class="upload-label">
                            📎 Carica PDF
                            <input type="file" accept=".pdf" onchange="uploadPdf('${c._id}', this)">
                        </label>
                        <button class="btn-sm danger" onclick="eliminaCanto('${c._id}')">Elimina</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('btn-aggiungi').addEventListener('click', async () => {
            const titolo = document.getElementById('c-titolo').value.trim();
            if (!titolo) { alert('Il titolo è obbligatorio.'); return; }

            const body = {
                titolo,
                autore: document.getElementById('c-autore').value.trim(),
                categoria: document.getElementById('c-categoria').value.trim(),
                testo: document.getElementById('c-testo').value.trim(),
                note: document.getElementById('c-note').value.trim()
            };

            const res = await apiCall('/canti', { method: 'POST', body: JSON.stringify(body) });
            const msg = document.getElementById('msg-canto');
            if (res?._id) {
                msg.className = 'messaggio ok';
                msg.textContent = '✓ Canto aggiunto e notifica inviata!';
                document.getElementById('c-titolo').value = '';
                document.getElementById('c-autore').value = '';
                document.getElementById('c-categoria').value = '';
                document.getElementById('c-testo').value = '';
                document.getElementById('c-note').value = '';
                caricaCanti();
            } else {
                msg.className = 'messaggio err';
                msg.textContent = res?.message || 'Errore nel salvataggio.';
            }
        });

        window.eliminaCanto = async (id) => {
            if (!confirm('Eliminare questo canto?')) return;
            await apiCall(`/canti/${id}`, { method: 'DELETE' });
            caricaCanti();
        };

        window.uploadPdf = async (id, input) => {
            const file = input.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            const token = localStorage.getItem('csv_token');
            const res = await fetch(`https://corisanvito-backend.onrender.com/canti/${id}/upload`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            const data = await res.json();
            alert(data.message || 'File inviato!');
        };

        caricaCanti();
    </script>
</body>

</html>
